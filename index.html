<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Parcheggio</title>
<style>
  :root { color-scheme: dark; --bg: #000; --fg: #eee; --dim: #888; --line: #222; --red: #c4001d; }
  body { margin: 0; padding: 32px 16px; background: var(--bg); color: var(--fg); font: 18px/1.5 system-ui, sans-serif; }
  main { max-width: 480px; margin: 0 auto; }
  h1 { margin: 0 0 24px; font-size: 28px; font-weight: 300; letter-spacing: .5px; }
  #where { font-size: 20px; padding-bottom: 24px; border-bottom: 1px solid var(--line); }
  small { color: var(--dim); font-size: 15px; }
  a, button { display: block; box-sizing: border-box; width: 100%; margin-top: 16px; padding: 16px; border: 0;
    border-radius: 12px; font: inherit; text-align: center; text-decoration: none; color: #fff; background: var(--red); }
  button { background: var(--line); }
  [hidden] { display: none; }
</style>
</head>
<body>
<main>
  <h1>Audi A3</h1>
  <div id="where">…</div>
  <a id="maps" hidden>Apri in Maps</a>
  <button id="enable" hidden>Attiva le notifiche</button>
  <p><small id="msg"></small></p>
</main>
<script>
// La posizione sta nel repo privato rdagmr98/a3-data: il token arriva una volta nell'indirizzo (#t=...) e resta
// solo in questo browser. Il tablet dell'auto scrive park.json a quadro spento e lo svuota alla riaccensione.
const KEY = 'BDaGF1Ln9hZ5E64XQoKF2eYpnNMbjmZrIJEl19iInMpX0yuWMknj-ueIrTw2-48PNBCIB8_LaNmO9t9YBKRHVlY';
const API = 'https://api.github.com/repos/rdagmr98/a3-data/contents/';
const $ = id => document.getElementById(id);
const hash = location.hash.match(/t=([^&]+)/);
let T = null;
try { if (hash) localStorage.t = hash[1]; T = localStorage.t; } catch (e) { T = hash && hash[1]; }
if (hash) history.replaceState(null, '', location.pathname);

const gh = (f, o = {}) => fetch(API + f, { ...o, cache: 'no-store',
  headers: { Authorization: 'Bearer ' + T, Accept: 'application/vnd.github+json' } });
const dec = s => JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, '')), c => c.charCodeAt(0))));
const enc = o => btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(o, null, 1))));

async function show() {
  if (!T) { $('where').textContent = 'Pagina non collegata: aprila dal link con il token.'; return; }
  const r = await gh('park.json');
  if (!r.ok && r.status !== 404) { $('where').textContent = 'GitHub non risponde (' + r.status + ').'; return; }
  const p = r.ok ? dec((await r.json()).content) : {};
  if (p.lat == null) { $('where').textContent = 'Nessun parcheggio salvato: l\'auto è accesa o non è ancora stata parcheggiata.'; return; }
  const d = new Date(p.time);
  $('where').innerHTML = 'Parcheggiata ' + d.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' }) +
    ' alle ' + d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' }) + '<br><small>precisione ' + p.acc + ' m</small>';
  $('maps').href = 'https://www.google.com/maps/search/?api=1&query=' + p.lat + ',' + p.lon;
  $('maps').hidden = false;
}

async function enable() {
  try {
    if (await Notification.requestPermission() !== 'granted') throw Error('permesso negato');
    const reg = await navigator.serviceWorker.ready;
    const s = (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: KEY })).toJSON();
    const r = await gh('subs.json');
    const old = r.ok ? await r.json() : null;
    const list = (old ? dec(old.content) : []).filter(x => x.endpoint !== s.endpoint).concat([s]);
    const w = await gh('subs.json', { method: 'PUT',
      body: JSON.stringify({ message: 'iscrizione', content: enc(list), ...(old && { sha: old.sha }) }) });
    if (!w.ok) throw Error('GitHub ' + w.status);
    $('enable').hidden = true;
    $('msg').textContent = 'Notifiche attive su questo telefono.';
  } catch (e) { $('msg').textContent = 'Errore: ' + e.message; }
}

$('enable').onclick = enable;
show().catch(e => { $('where').textContent = 'Errore: ' + e.message; });
if ('serviceWorker' in navigator && T) navigator.serviceWorker.register('sw.js').then(async reg => {
  $('enable').hidden = !!(await reg.pushManager.getSubscription()) && Notification.permission === 'granted';
});
</script>
</body>
</html>
